name: Build NEO//WAVE

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build VST3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --target NeoWave_VST3 --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: NEOWAVE-VST3-${{ runner.os }}
          path: build/NeoWave_artefacts/Release/VST3/NEOWAVE.vst3

  offline-test:
    name: Offline audio test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure and build test tool
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target NeoWaveTest --parallel
      - name: Render all presets (NaN / level / CPU), state round-trip, random stress
        run: |
          ./build/NeoWaveTest_artefacts/Release/NeoWaveTest
          ./build/NeoWaveTest_artefacts/Release/NeoWaveTest --state
          ./build/NeoWaveTest_artefacts/Release/NeoWaveTest --random --repeat 100
